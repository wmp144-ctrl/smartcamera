[project]
name = "camerasmart-backend"
version = "1.0.0"
description = "CCTV object & motion detection, event recording and alerting backend"
requires-python = ">=3.11"
readme = "../README.md"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF"]
ignore = ["PLR0912", "PLR0915", "PLR0911", "PLR0913", "PLR2004", "B008", "RUF012"]
