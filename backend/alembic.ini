; CameraSmart — Alembic configuration.
; The actual database URL comes from app.core.config (see alembic/env.py), so
; this file only holds the script layout and logging defaults.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is resolved at runtime from CAMERASMART_DATABASE_URL

; Format generated revisions with ruff when it is available:
;   alembic -x format_revisions=1 revision --autogenerate -m "..."
; Left disabled by default so migrations work on an offline machine that only
; has the runtime requirements installed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
